<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>企業註冊｜NTUT Career Platform</title>

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/enterprise-portal.css">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">NTUT</span>
        <span class="brand-text">
          <strong>Career Platform</strong>
          <small>實習與就業職缺平台</small>
        </span>
      </a>

      <nav class="main-nav">
        <a href="index.html">學生找職缺</a>
        <a href="company-register.html">企業刊登職缺</a>
        <a class="nav-login" href="company-login.html">企業登入</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <section class="auth-card auth-card-wide">
      <p class="eyebrow">企業端</p>
      <h1>建立企業帳號</h1>
      <p class="auth-intro">
        一間企業限一組帳號；完成註冊後需等待平台審核。
      </p>

      <form id="registerForm" class="auth-form">
        <div class="auth-grid">
          <div class="field field-wide">
            <label>企業全銜 *</label>
            <input name="companyName" required>
          </div>

          <div class="field">
            <label>企業簡稱</label>
            <input name="companyShortName">
          </div>

          <div class="field">
            <label>統一編號 *</label>
            <input name="taxId" inputmode="numeric" maxlength="8" required>
          </div>

          <div class="field">
            <label>產業類別 *</label>
            <input name="industry" required>
          </div>

          <div class="field field-wide">
            <label>企業地址 *</label>
            <input name="companyAddress" required>
          </div>

          <div class="field field-wide">
            <label>企業網站</label>
            <input name="website" type="url" placeholder="https://">
          </div>

          <div class="field field-wide">
            <label>企業介紹</label>
            <textarea name="companyDescription" rows="5"></textarea>
          </div>

          <div class="field">
            <label>聯絡人姓名 *</label>
            <input name="contactName" required>
          </div>

          <div class="field">
            <label>聯絡人職稱</label>
            <input name="contactTitle">
          </div>

          <div class="field">
            <label>聯絡電話 *</label>
            <input name="contactPhone" required>
          </div>

          <div class="field">
            <label>登入 Email *</label>
            <input name="loginEmail" type="email" required>
          </div>

          <div class="field">
            <label>密碼 *</label>
            <input
              name="password"
              type="password"
              minlength="10"
              autocomplete="new-password"
              required
            >
          </div>

          <div class="field">
            <label>確認密碼 *</label>
            <input
              name="confirmPassword"
              type="password"
              minlength="10"
              autocomplete="new-password"
              required
            >
          </div>

          <div class="field">
            <label>Email 驗證碼 *</label>
            <input
              name="verificationCode"
              inputmode="numeric"
              maxlength="6"
              required
            >
          </div>

          <div class="field">
            <label>&nbsp;</label>
            <button
              id="sendCodeButton"
              class="button button-secondary"
              type="button"
            >
              寄送驗證碼
            </button>
          </div>
        </div>

        <div id="formMessage" class="form-message" hidden></div>

        <button
          id="registerSubmitButton"
          class="button button-primary auth-submit"
          type="submit"
        >
          建立企業帳號
        </button>

        <p class="auth-switch">
          已有帳號？
          <a href="company-login.html">前往登入</a>
        </p>
      </form>
    </section>
  </main>

  <script src="js/company-api.js"></script>
  <script src="js/company-register.js"></script>
</body>
</html>
